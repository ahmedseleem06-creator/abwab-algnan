name: abwab_aljinan
description: "تطبيق أبواب الجنان - رفيق الاستعداد لرمضان المبارك"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^3.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon-512.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon-192.png
    - assets/icons/icon-512.png
