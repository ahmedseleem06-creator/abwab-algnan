name: Build Abwab Al-Jinan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform scaffolding
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/app_backup
            cp -r lib pubspec.yaml /tmp/app_backup/
            if [ -d "assets" ]; then cp -r assets /tmp/app_backup/; fi
            flutter create . --project-name abwab_aljinan --platforms=android --org com.abwab.aljinan
            rm -rf lib pubspec.yaml
            cp -r /tmp/app_backup/lib .
            cp /tmp/app_backup/pubspec.yaml .
            if [ -d "/tmp/app_backup/assets" ]; then cp -r /tmp/app_backup/assets .; fi
          fi

      - name: Configure Android Permissions & MinSdk
        run: |
          # 1. Update AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>' "$MANIFEST"
              sed -i '/<application/a \        android:usesCleartextTraffic="true"' "$MANIFEST"
            fi
          fi

          # 2. Force minSdkVersion 21 in local.properties and build.gradle
          echo "flutter.minSdkVersion=21" >> android/local.properties 2>/dev/null || true
          
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle.kts
          fi

          # 3. Add Proguard rules for WebView
          mkdir -p android/app
          cat << 'EOF' > android/app/proguard-rules.pro
          -keepattributes *Annotation*,Signature
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -dontwarn android.webkit.**
          -dontwarn io.flutter.plugins.webviewflutter.**
          EOF

      - name: Setup Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: |
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || true

      - name: Build Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug

      - name: Prepare APK File for Download
        run: |
          mkdir -p release_output
          find build/app/outputs -name "*.apk" -exec cp {} release_output/Abwab-AlJinan-Official-APK.apk \;
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abwab-AlJinan-Official-APK
          path: release_output/Abwab-AlJinan-Official-APK.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "أبواب الجنان - تطبيق أندرويد APK v1.0.0"
          body: |
            🌙 **تطبيق أبواب الجنان - النسخة الرسمية APK للهاتف**
            - تطبيق أندرويد مستقل بالكامل (Standalone Native App).
            - يشمل كافة ميزات شهر رمضان، متتبع العادات، المصحف الشريف، المسبحة، ومواقيت الصلاة.
            - حمل ملف `Abwab-AlJinan-Official-APK.apk` وثبته مباشرة على هاتفك.
          files: release_output/Abwab-AlJinan-Official-APK.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
