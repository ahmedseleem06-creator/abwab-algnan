name: Build Abwab Al-Jinan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform scaffolding
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/app_backup
            cp -r lib pubspec.yaml /tmp/app_backup/
            if [ -d "assets" ]; then cp -r assets /tmp/app_backup/; fi
            flutter create . --project-name abwab_aljinan --platforms=android --org com.abwab.aljinan
            rm -rf lib pubspec.yaml
            cp -r /tmp/app_backup/lib .
            cp /tmp/app_backup/pubspec.yaml .
            if [ -d "/tmp/app_backup/assets" ]; then cp -r /tmp/app_backup/assets .; fi
          fi

      - name: Configure Android Permissions & MinSdk
        run: |
          python3 -c "
          import glob, re, os

          # 1. Update AndroidManifest.xml
          mpath = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(mpath):
              with open(mpath, 'r', encoding='utf-8') as f:
                  m = f.read()
              perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n'''
              if 'android.permission.INTERNET' not in m:
                  m = m.replace('<application', perms + '    <application')
              if 'android:usesCleartextTraffic' not in m:
                  m = m.replace('<application', '<application\n        android:usesCleartextTraffic=\"true\"')
              with open(mpath, 'w', encoding='utf-8') as f:
                  f.write(m)
              print('AndroidManifest configured successfully.')

          # 2. Update all build.gradle files to minSdk = 21
          for gpath in glob.glob('android/app/build.gradle*'):
              with open(gpath, 'r', encoding='utf-8') as f:
                  g = f.read()
              g = re.sub(r'(minSdkVersion|minSdk)\s*=?\s*.*', r'\1 = 21', g)
              g = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', g)
              with open(gpath, 'w', encoding='utf-8') as f:
                  f.write(g)
              print(f'{gpath} configured with minSdk 21.')
          "

      - name: Setup Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: |
          if [ -f "assets/icons/icon-512.png" ]; then
            flutter pub run flutter_launcher_icons || true
          fi

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Prepare APK File for Download
        run: |
          mkdir -p release_output
          find build/app/outputs -name "*release*.apk" -exec cp {} release_output/Abwab-AlJinan-Release.apk \;
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abwab-AlJinan-Official-APK
          path: release_output/Abwab-AlJinan-Release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "أبواب الجنان - تطبيق أندرويد APK v1.0.0"
          body: |
            🌙 **تطبيق أبواب الجنان - النسخة الرسمية APK للهاتف**
            - تطبيق أندرويد مستقل بالكامل (Standalone Native App).
            - يشمل كافة ميزات شهر رمضان، متتبع العادات، المصحف الشريف، المسبحة، ومواقيت الصلاة.
            - حمل ملف `Abwab-AlJinan-Release.apk` أدناه وثبته مباشرة على هاتفك.
          files: release_output/Abwab-AlJinan-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
